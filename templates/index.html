{% extends "base.html" %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/rpg-awesome/0.2.0/css/rpg-awesome.min.css">

<section class="search-section" id="guildNetwork">
    <svg id="arenaLines"></svg>

    <div class="central-node" id="mainSearchNode">

        <div class="search-input-wrapper">
            <div id="architecturalSuggestions" class="architectural-suggestions">
                <div id="symptomBox" class="suggestions-box"></div>
                <div id="actionBox" class="suggestions-box"></div>
                <div id="colorBox" class="suggestions-box"></div>
            </div>

            <input type="text" id="universalSearch" class="search-input"
                   placeholder="Wpisz roślinę, czynność, objaw lub porę roku..." autocomplete="off">
        </div>

        <div id="horizontalResults"></div>

        <div id="taskResults" class="task-results-container"></div>

    </div>
    </div>

    <div id="recipeCarousel" class="carousel-container"></div>
</section>

<section>
    <h2 class="bestiary-header">Bestiariusz Roślin</h2>
    <div id="bestiaryGrid" class="bestiary-grid"></div>
</section>

<div class="modal fade" id="dynamicRecipeModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content" style="border-radius: 0; border: 2px solid #3e4a3d; background-color: #fdfaf0; font-family: 'Crimson Text', serif;">
            <div class="modal-header" style="border-bottom: 1px solid #d1c7a7; background: #f4f1ea;">
                <div>
                    <h2 id="modalRecipeTitle" style="margin: 0; font-size: 1.8rem; border: none; color: #3e4a3d;">Tytuł Przepisu</h2>
                    <p style="margin: 0; color: #666; font-style: italic;">Gatunek: <strong id="modalRecipePlantName">Roślina</strong></p>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <div id="modalRecipeTags" style="margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px dashed #d1c7a7; display:none;"></div>
                <div class="row">
                    <div class="col-lg-5" style="border-right: 1px dashed #d1c7a7;">
                        <h4 style="color: #b8860b; margin-top: 0;">🛒 Składniki</h4>
                        <ul id="modalRecipeIngredients" style="list-style-type: square; padding-left: 20px;"></ul>
                    </div>
                    <div class="col-lg-7">
                        <h4 style="color: #3e4a3d; margin-top: 0;">🔥 Przygotowanie</h4>
                        <div id="modalRecipePreparation" style="font-size: 1.05rem; line-height: 1.7;"></div>
                        <div id="modalRecipeDosage" style="display:none; background: #e3f2fd; border: 1px solid #90caf9; padding: 15px; margin-top: 20px; border-radius: 4px;"></div>
                        <div id="modalRecipeNotes" style="display:none; background: #ffebee; border: 1px solid #ef9a9a; padding: 15px; margin-top: 15px; color: #c62828; border-radius: 4px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="megaAlertOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9999; backdrop-filter: blur(5px);">
    <div style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); background:#23201d; border:2px solid #9b4b4b; border-radius:8px; padding:40px; text-align:center; box-shadow:0 0 80px rgba(155,75,75,0.8); color:#fdfbf7; font-family:'Georgia', serif; min-width:350px;">
        <i class="ra ra-bleeding-eye" style="font-size: 60px; color: #9b4b4b; margin-bottom: 20px; display:block;"></i>
        <h2 style="color: #d1b880; margin: 0 0 15px 0; font-size: 28px; border:none; text-transform: uppercase;">Nieznane Zioło!</h2>
        <p style="font-size: 18px; color: #a89f91; margin-bottom: 25px;">Wiedza o <strong id="megaAlertPlantName" style="color: #fff; text-decoration: underline;"></strong><br>nie została jeszcze spisana.</p>
        <button onclick="document.getElementById('megaAlertOverlay').style.display='none'" style="background: #3a2b21; border: 1px solid #5a4b3a; color: #d1b880; padding: 12px 30px; cursor: pointer; font-size: 14px; text-transform: uppercase; border-radius: 4px; transition: 0.3s;">Powrót na szlak</button>
    </div>
</div>

<script>
    const BASE_URL = window.location.origin;
    const plantsData = {{ plants_full_data | default('[]') | safe }};
    const kalendarz = {{ calendar_data | default('{}') | safe }};
    let recipesData = {{ recipes_full_data | default('[]') | safe }};
    if (!Array.isArray(recipesData)) recipesData = [];
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="{{ url_for('static', filename='js/tags.js') }}"></script>
<script src="{{ url_for('static', filename='js/index.js') }}"></script>
{% endblock %}
