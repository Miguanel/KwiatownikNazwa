<script>
document.addEventListener("DOMContentLoaded", () => {
    const form = document.getElementById("searchForm");
    const input = document.getElementById("searchInput");
    const resultsContainer = document.getElementById("resultsContainer");
    
    let recipesData = [];

    // Pobieramy naszą bazę PRZEPISÓW
    fetch("/api/all_recipes.json")
        .then(response => response.json())
        .then(data => {
            recipesData = data;
            console.log("Baza przepisów załadowana! Liczba receptur: ", recipesData.length);
        })
        .catch(error => {
            console.error("Błąd ładowania bazy przepisów:", error);
            resultsContainer.innerHTML = '<p style="color: red; text-align: center;">Błąd ładowania bazy danych. Odśwież stronę.</p>';
        });

    form.addEventListener("submit", (e) => {
        e.preventDefault(); 
        
        const query = input.value.toLowerCase().trim();
        if(!query) return;

        resultsContainer.innerHTML = '<p style="text-align: center; color: #666;">Szukam przepisów...</p>';
        
        // Szukamy w tytule, tagach, składnikach i nazwie rośliny
        const results = recipesData.filter(recipe => {
            const searchArea = `
                ${recipe.tytul || ''} 
                ${recipe.tagi ? recipe.tagi.join(' ') : ''} 
                ${recipe.skladniki ? recipe.skladniki.join(' ') : ''}
                ${recipe.roslina || ''}
            `.toLowerCase();
            return searchArea.includes(query);
        });

        resultsContainer.innerHTML = `<h3 style="margin-bottom: 20px;">Znalezione receptury dla: "${query}"</h3><div style="display: grid; gap: 15px;"></div>`;
        const listContainer = resultsContainer.querySelector('div');

        if(results.length === 0) {
            resultsContainer.innerHTML += '<p style="text-align: center; color: #999; margin-top: 30px;">Nie znaleziono przepisów odpowiadających temu hasłu.</p>';
            return;
        }

        // Rysowanie kart PRZEPISÓW
        results.forEach(recipe => {
            // Bezpieczne sprawdzanie właściwości
            const typeColor = recipe.typ === 'medyczne' ? '#8b0000' : '#d4a017';
            const typeIcon = recipe.typ === 'medyczne' ? 'bi-bandaid' : 'bi-cup-hot';
            const tagsHtml = recipe.tagi 
                ? recipe.tagi.map(t => `<span style="background: #e9f0e8; color: #2d5a27; padding: 3px 8px; border-radius: 12px; font-size: 0.75rem; margin-right: 5px;">#${t}</span>`).join('') 
                : '';
            
            // Link kieruje do opisu rośliny, z której pochodzi przepis
            const plantUrl = `../plant/${recipe.slug}/`;

            const cardHtml = `
            <a href="${plantUrl}" style="text-decoration: none; color: inherit;">
                <div class="result-card" style="background: white; border: 1px solid #d1c7a7; border-left: 5px solid ${typeColor}; padding: 20px; border-radius: 8px; transition: transform 0.2s;">
                    <div style="display: flex; justify-content: space-between; align-items: start;">
                        <h4 style="margin: 0; color: #3e4a3d; font-size: 1.2rem;">${recipe.tytul}</h4>
                        <span style="color: ${typeColor}; font-size: 0.9rem; font-weight: bold;"><i class="bi ${typeIcon}"></i> ${recipe.typ}</span>
                    </div>
                    <p style="font-size: 0.9rem; color: #666; margin: 5px 0 15px 0;">
                        <strong>Główny składnik:</strong> <span style="color: #2d5a27;">${recipe.roslina}</span>
                    </p>
                    <div style="margin-bottom: 15px;">
                        ${tagsHtml}
                    </div>
                    <span style="font-size: 0.8rem; background: #3e4a3d; color: white; padding: 5px 15px; border-radius: 20px;">Otwórz stronę rośliny, aby poznać przepis ⮕</span>
                </div>
            </a>
            `;
            listContainer.insertAdjacentHTML('beforeend', cardHtml);
        });
    });
});
</script>
