<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Kwiatownik – logo: kwiatownik szkarłatny na gałązce" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Kwiatownik</title>
  <!-- tło: zielony krąg z celtyckim podwójnym pierścieniem -->
  <circle cx="256" cy="256" r="250" fill="#3e4a3d"/>
  <circle cx="256" cy="256" r="232" fill="none" stroke="#d1b880" stroke-width="7"/>
  <circle cx="256" cy="256" r="218" fill="none" stroke="#d1b880" stroke-width="2" stroke-dasharray="2 9" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="210" fill="#fdfaf0"/>
  <clipPath id="kwIn"><circle cx="256" cy="256" r="210"/></clipPath>
  <g clip-path="url(#kwIn)">
  <!-- kwiat (dzwonek) na łodyżce z góry -->
  <path d="M70 120 C110 150 112 200 104 246" fill="none" stroke="#5f7a3a" stroke-width="7" stroke-linecap="round"/>
  <path d="M96 168 C70 160 58 140 62 122 C82 128 96 146 96 168 Z" fill="#6f8f45"/>
  <path d="M80 246 C74 278 82 304 104 312 C126 304 134 278 126 246 C118 240 88 240 80 246 Z" fill="#f2b641"/>
  <path d="M82 300 C92 312 116 312 126 300 C124 318 114 330 104 330 C94 330 84 318 82 300 Z" fill="#e0882a"/>
  <path d="M104 252 L104 300" stroke="#c97a1f" stroke-width="3" stroke-linecap="round"/>
  <!-- gałąź z liśćmi -->
  <path d="M470 372 C410 350 330 342 236 352" fill="none" stroke="#6b4f2a" stroke-width="11" stroke-linecap="round"/>
  <path d="M400 356 C410 322 440 306 470 310 C458 340 432 358 400 356 Z" fill="#5f7a3a"/>
  <path d="M330 350 C326 382 342 404 368 412 C374 384 358 360 330 350 Z" fill="#6f8f45"/>
  <path d="M280 352 C268 326 274 300 296 286 C306 312 300 338 280 352 Z" fill="#5f7a3a"/>
  <!-- ogon: długi, zielony, metaliczny -->
  <path d="M318 300 L452 446 L438 456 L300 318 Z" fill="#2f8f5b"/>
  <path d="M322 298 L458 430 L452 440 L310 306 Z" fill="#3fae72"/>
  <!-- nogi -->
  <path d="M258 318 L252 352 M282 320 L284 352" stroke="#3a2b21" stroke-width="6" stroke-linecap="round"/>
  <!-- tułów (szkarłatny) -->
  <path d="M178 232 C196 184 278 176 322 214 C354 244 346 300 304 322 C262 342 206 324 186 292 C174 274 172 252 178 232 Z" fill="#c8202f"/>
  <!-- żółty kuper -->
  <ellipse cx="318" cy="300" rx="20" ry="12" transform="rotate(35 318 300)" fill="#f2c230"/>
  <!-- skrzydło -->
  <path d="M232 238 C270 212 326 230 344 272 C320 304 268 310 240 286 C228 272 226 252 232 238 Z" fill="#8f1a26"/>
  <path d="M252 262 C276 256 304 262 324 278 M248 278 C272 276 296 282 314 292" fill="none" stroke="#c8202f" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <!-- głowa -->
  <circle cx="186" cy="216" r="44" fill="#d82a3b"/>
  <!-- metalicznie zielona czapeczka -->
  <path d="M146 204 C154 170 206 160 228 190 C210 182 172 184 146 204 Z" fill="#2f9a6a"/>
  <!-- oko -->
  <circle cx="174" cy="210" r="7" fill="#1f1a17"/>
  <circle cx="176" cy="207.5" r="2.2" fill="#fff"/>
  <!-- długi, zakrzywiony dziób sięgający do kwiatu -->
  <path d="M146 222 C126 226 112 236 104 252 C118 240 132 234 150 232 Z" fill="#2b2420"/>
  <!-- ciemny „wąs” na policzku -->
  <path d="M158 236 C170 246 186 248 198 244" fill="none" stroke="#7e1520" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
